name: On-Demand Benchmarks

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to benchmark'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
        default: 'all'
      iterations:
        description: 'Harness iterations per app'
        type: number
        default: 30
      microbenchmarks:
        description: 'Also run BenchmarkDotNet microbenchmarks'
        type: boolean
        default: false
      hermes_aot:
        description: 'Also benchmark HermesTestApp published with Native AOT'
        type: boolean
        default: true

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
          - os: macos-latest
            rid: osx-x64
            platform: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check if platform should run
        id: check
        shell: bash
        run: |
          if [[ "${{ inputs.platforms }}" != "all" && "${{ inputs.platforms }}" != "${{ matrix.platform }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'

      # macOS: Build native library
      - name: Build Native Library (macOS)
        if: steps.check.outputs.skip != 'true' && matrix.os == 'macos-latest'
        run: make universal
        working-directory: src/Hermes.Native.macOS

      # Linux: Install dependencies and build native library
      - name: Install Linux Dependencies
        if: steps.check.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libnotify4 is not preinstalled on ubuntu-24.04 runners but Photino's
          # and PhotinoX's prebuilt native libraries link against libnotify.so.4
          # clang and zlib1g-dev are what the Native AOT toolchain links with
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev cmake xvfb libnotify4 clang zlib1g-dev

      - name: Build Native Library (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        run: ./build.sh
        working-directory: src/Hermes.Native.Linux

      - name: Start Virtual Display (Linux)
        if: steps.check.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "GDK_BACKEND=x11" >> $GITHUB_ENV

      - name: Restore
        if: steps.check.outputs.skip != 'true'
        run: dotnet restore

      - name: Build Benchmark Apps
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          dotnet build benchmarks/Hermes.Benchmarks.Apps/HermesTestApp -c Release --no-restore
          dotnet build benchmarks/Hermes.Benchmarks.Apps/PhotinoTestApp -c Release --no-restore
          dotnet build benchmarks/Hermes.Benchmarks.Apps/PhotinoXTestApp -c Release --no-restore
          dotnet build benchmarks/Hermes.Benchmarks.Harness -c Release --no-restore

      # continue-on-error so a platform whose AOT toolchain or publish is broken still
      # reports its JIT comparison; the harness step turns the failure into a visible
      # warning instead of an AOT row. The RID comes from the runner, not the matrix,
      # because macos-latest is arm64 and a foreign-RID AOT binary would run under
      # Rosetta and measure the wrong thing. Publish restores for the RID itself, so
      # no --no-restore here.
      - name: Publish Hermes AOT
        id: aot
        if: steps.check.outputs.skip != 'true' && inputs.hermes_aot
        continue-on-error: true
        shell: bash
        run: |
          RID=$(dotnet --info | sed -n 's/^ *RID: *//p' | head -1)
          OUT=benchmarks/Hermes.Benchmarks.Apps/HermesTestApp/bin/Release/net10.0/aot-publish
          echo "Publishing HermesTestApp for $RID with Native AOT"
          dotnet publish benchmarks/Hermes.Benchmarks.Apps/HermesTestApp -c Release -r "$RID" -p:PublishAot=true -o "$OUT"
          BIN="$OUT/HermesTestApp"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="$OUT/HermesTestApp.exe"
          fi
          test -f "$BIN"
          echo "binary=$BIN" >> "$GITHUB_OUTPUT"

      - name: Run Startup & Memory Harness
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x benchmarks/Hermes.Benchmarks.Apps/*/bin/Release/net10.0/*TestApp 2>/dev/null || true
          fi
          AOT_ARGS=()
          if [[ "${{ steps.aot.outcome }}" == "success" ]]; then
            AOT_ARGS=(--hermes-aot "${{ steps.aot.outputs.binary }}")
          elif [[ "${{ inputs.hermes_aot }}" == "true" ]]; then
            echo "::warning::Hermes AOT publish failed on ${{ matrix.platform }}; benchmarking without the AOT row. See the 'Publish Hermes AOT' step."
          fi
          dotnet run --project benchmarks/Hermes.Benchmarks.Harness -c Release --no-build -- --iterations ${{ inputs.iterations }} "${AOT_ARGS[@]}"

      # always() so a red harness run (nonzero exit on failed iterations)
      # still renders the table and failure details in the job summary.
      # skip == 'false' (not != 'true') so a failed check step, which leaves
      # the output empty, does not run this for a platform that never set up.
      # The harness exits before writing benchmark-results.json when a binary
      # is missing, so guard the jq or its error would bury the real failure.
      - name: Write Step Summary
        if: always() && steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          if [[ ! -f benchmark-results.json ]]; then
            echo "### Benchmark Results (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Harness exited before producing results (missing app binary or build failure); see the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${{ steps.aot.outcome }}" == "failure" ]]; then
            echo "> **Warning:** the Hermes AOT publish failed on ${{ matrix.platform }}, so there is no AOT row below. See the 'Publish Hermes AOT' step log." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r '
            def fmt: if . == null then "-" else (. * 100 | round / 100) end;
            ([.Hermes, .HermesAot, .Photino, .PhotinoX, .Tauri] | map(select(. != null))) as $apps |
            "### Benchmark Results (${{ matrix.platform }})",
            "",
            "Environment: \(.Environment.OS), \(.Environment.Runtime), \(.Environment.ProcessorCount) cores",
            "",
            "| App | Window Mean (ms) | Window Median (ms) | Startup Mean (ms) | Startup Median (ms) | Startup P95 (ms) | Memory Mean (MB) | Memory Median (MB) | Failures |",
            "| --- | --- | --- | --- | --- | --- | --- | --- | --- |",
            ($apps[] | "| \(.Name) | \(.WindowTimeMs.Mean | fmt) | \(.WindowTimeMs.Median | fmt) | \(.StartupTimeMs.Mean | fmt) | \(.StartupTimeMs.Median | fmt) | \(.StartupTimeMs.P95 | fmt) | \(.PeakMemoryMB.Mean | fmt) | \(.PeakMemoryMB.Median | fmt) | \(.FailedIterations // 0) |"),
            "",
            ($apps[] | select(.FirstFailure != null) | "**\(.Name)** first failure: \(.FirstFailure)")
          ' benchmark-results.json >> "$GITHUB_STEP_SUMMARY"

      # warn, not error: on an early harness exit the JSON never exists and the
      # job is already red; a second failure here would just add noise
      - name: Upload Harness Results
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}
          path: benchmark-results.json
          if-no-files-found: warn

      # always() so a red harness run does not skip the microbenchmarks; they
      # are an independent BenchmarkDotNet suite, not downstream of the harness
      - name: Run Microbenchmarks
        if: always() && steps.check.outputs.skip == 'false' && inputs.microbenchmarks
        run: dotnet run -c Release -- --filter '*'
        working-directory: benchmarks/Hermes.Benchmarks

      - name: Upload Microbenchmark Results
        if: always() && steps.check.outputs.skip == 'false' && inputs.microbenchmarks
        uses: actions/upload-artifact@v4
        with:
          name: microbenchmarks-${{ matrix.platform }}
          path: benchmarks/Hermes.Benchmarks/BenchmarkDotNet.Artifacts/results
          if-no-files-found: error

      - name: Skipped
        if: steps.check.outputs.skip == 'true'
        run: echo "Skipping ${{ matrix.platform }} - not selected"
