name: Build and Publish NuGet

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to NuGet'
        type: boolean
        default: false
      publish_preview:
        description: 'Publish preview packages to NuGet'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # macOS: Build native library
      - name: Build Native Library (macOS)
        if: runner.os == 'macOS'
        run: make universal
        working-directory: src/Hermes.Native.macOS

      # Linux: Install dependencies and build native library
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev cmake

      - name: Build Native Library (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh
        working-directory: src/Hermes.Native.Linux

      # All platforms: Build and test
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      # All platforms: Upload compiled DLL and PDB for multi-RID packaging
      - name: Upload Platform Binaries
        uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.rid }}
          path: |
            src/Hermes/bin/Release/net11.0/Hermes.dll
            src/Hermes/bin/Release/net11.0/Hermes.pdb
          retention-days: 14

      # Windows only: Upload WebView2 managed SDK (needed at runtime, doesn't flow transitively via NuGet)
      - name: Upload WebView2 Binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: webview2-win-x64
          path: |
            src/Hermes/bin/Release/net11.0/Microsoft.Web.WebView2.Core.dll
            src/Hermes/bin/Release/net11.0/runtimes/win-x64/native/WebView2Loader.dll
          retention-days: 14

      # macOS only: Upload native binary
      - name: Upload Native Binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-osx
          path: src/Hermes.Native.macOS/lib/libHermes.Native.macOS.dylib
          retention-days: 14

      # Linux only: Upload native binary (one per RID; the shim is architecture-specific)
      - name: Inspect Native Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          LIB=src/Hermes.Native.Linux/lib/libHermes.Native.Linux.so
          file "$LIB"
          echo "glibc floor: $(objdump -T "$LIB" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"

      - name: Upload Native Binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/Hermes.Native.Linux/lib/libHermes.Native.Linux.so
          retention-days: 14

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # macOS: Build native library
      - name: Build Native Library (macOS)
        if: runner.os == 'macOS'
        run: make universal
        working-directory: src/Hermes.Native.macOS

      # Linux: Install dependencies and build native library
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev cmake xvfb

      - name: Build Native Library (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh
        working-directory: src/Hermes.Native.Linux

      - name: Start Virtual Display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: Restore
        run: dotnet restore

      - name: Build Sample App
        run: dotnet build samples/SmokeTestApp -c Release --no-restore

      - name: Checkout shared smoke verdict
        uses: actions/checkout@v4
        with:
          repository: Mythetech/workflows
          ref: 586f3f549771d0d523007ee4bb8b7cf3fa9d39a9
          path: .workflows

      - name: Run every smoke fault
        shell: pwsh
        env:
          DISPLAY: ':99'
          GDK_BACKEND: x11
        run: ./.github/scripts/Test-SmokeFaults.ps1 -AppPath 'samples/SmokeTestApp/bin/Release/net11.0/${{ runner.os == 'Windows' && 'SmokeTestApp.exe' || 'SmokeTestApp' }}' -VerdictScript .workflows/actions/smoke-verdict/SmokeVerdict.ps1 -OutputDir smoke-output

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ matrix.rid }}
          path: smoke-output
          retention-days: 14

  pack-and-publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish == 'true' || github.event.inputs.publish_preview == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Download platform-specific DLLs
      - name: Download Windows DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-win-x64
          path: artifacts/dll-win-x64

      - name: Download Linux DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-linux-x64
          path: artifacts/dll-linux-x64

      - name: Download Linux arm64 DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-linux-arm64
          path: artifacts/dll-linux-arm64

      - name: Download macOS DLL
        uses: actions/download-artifact@v4
        with:
          name: dll-osx
          path: artifacts/dll-osx

      - name: Download Native Binary (macOS)
        uses: actions/download-artifact@v4
        with:
          name: native-osx
          path: artifacts/native-osx

      - name: Download Native Binary (Linux x64)
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native-linux-x64

      - name: Download Native Binary (Linux arm64)
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: artifacts/native-linux-arm64

      - name: Download WebView2 Binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: webview2-win-x64
          path: artifacts/webview2-win-x64

      - name: Restore
        run: dotnet restore

      - name: Determine Version Suffix
        id: versioning
        run: |
          if [[ "${{ github.event.inputs.publish_preview }}" == "true" ]]; then
            echo "SUFFIX_FLAG=-p:VersionSuffix=preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            echo "SUFFIX_FLAG=" >> $GITHUB_OUTPUT
          fi

      - name: Build Hermes.Contracts
        run: dotnet build src/Hermes.Contracts/Hermes.Contracts.csproj -c Release --no-restore

      - name: Pack Hermes.Contracts
        run: |
          dotnet pack src/Hermes.Contracts/Hermes.Contracts.csproj \
            -c Release \
            --no-build \
            ${{ steps.versioning.outputs.SUFFIX_FLAG }} \
            -o packages

      - name: Build Hermes (for reference assembly)
        run: dotnet build src/Hermes/Hermes.csproj -c Release --no-restore

      - name: Pack Hermes
        run: |
          dotnet pack src/Hermes/Hermes.csproj \
            -c Release \
            --no-build \
            -p:IsPackaging=true \
            -p:CIArtifactsPath=${{ github.workspace }}/artifacts \
            ${{ steps.versioning.outputs.SUFFIX_FLAG }} \
            -o packages

      - name: Build Hermes.Blazor
        run: dotnet build src/Hermes.Blazor/Hermes.Blazor.csproj -c Release --no-restore

      - name: Pack Hermes.Blazor
        run: |
          dotnet pack src/Hermes.Blazor/Hermes.Blazor.csproj \
            -c Release \
            --no-build \
            ${{ steps.versioning.outputs.SUFFIX_FLAG }} \
            -o packages

      - name: Build Hermes.Web
        run: dotnet build src/Hermes.Web/Hermes.Web.csproj -c Release --no-restore

      - name: Pack Hermes.Web
        run: |
          dotnet pack src/Hermes.Web/Hermes.Web.csproj \
            -c Release \
            --no-build \
            ${{ steps.versioning.outputs.SUFFIX_FLAG }} \
            -o packages

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
          retention-days: 14

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push packages/*.nupkg \
            --api-key ${{ secrets.NUGET_ORG_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github https://nuget.pkg.github.com/mythetech/index.json
          dotnet nuget push packages/*.nupkg --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
