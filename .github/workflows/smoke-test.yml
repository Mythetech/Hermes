name: Smoke Mode

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-faults:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            app: samples/SmokeTestApp/bin/Release/net11.0/SmokeTestApp.exe
          - os: ubuntu-latest
            platform: linux
            app: samples/SmokeTestApp/bin/Release/net11.0/SmokeTestApp
          - os: macos-latest
            platform: macos
            app: samples/SmokeTestApp/bin/Release/net11.0/SmokeTestApp

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Native Library (macOS)
        if: matrix.os == 'macos-latest'
        run: make universal
        working-directory: src/Hermes.Native.macOS

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev cmake xvfb

      - name: Build Native Library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./build.sh
        working-directory: src/Hermes.Native.Linux

      - name: Start Virtual Display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: Build SmokeTestApp
        run: dotnet build samples/SmokeTestApp -c Release

      - name: Checkout shared smoke verdict
        uses: actions/checkout@v4
        with:
          repository: Mythetech/workflows
          ref: 586f3f549771d0d523007ee4bb8b7cf3fa9d39a9
          path: .workflows

      - name: Run every smoke fault
        shell: pwsh
        env:
          DISPLAY: ':99'
          GDK_BACKEND: x11
        run: ./.github/scripts/Test-SmokeFaults.ps1 -AppPath '${{ matrix.app }}' -VerdictScript .workflows/actions/smoke-verdict/SmokeVerdict.ps1 -OutputDir smoke-output

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ matrix.platform }}
          path: smoke-output
          retention-days: 14
