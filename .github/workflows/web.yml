name: Web Packages and Samples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build npm Packages and Web Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The other packages and every sample resolve @mythetech/hermes-bridge through a file: link to its
      # built output, so the packages are built first and in dependency order.
      - name: Build and Test @mythetech/hermes-bridge
        working-directory: packages/hermes-bridge
        run: |
          npm ci
          npm run build
          npm test

      - name: Build @mythetech/hermes-react
        working-directory: packages/hermes-react
        run: |
          npm ci
          npm run build

      # @mythetech/hermes-svelte ships its TypeScript sources, so there is nothing to build; its dependencies
      # are installed so the Svelte sample's type check can resolve them.
      - name: Install @mythetech/hermes-svelte
        working-directory: packages/hermes-svelte
        run: npm ci

      # A Release build runs each sample's npm install and build through the Hermes.Web MSBuild targets and
      # copies the output into wwwroot, which is what an app consuming the package gets.
      - name: Build Sample Apps
        run: |
          for sample in WebHelloWorld ReactHelloWorld SvelteHelloWorld; do
            echo "::group::$sample"
            dotnet build "samples/$sample" -c Release
            test -f "samples/$sample/bin/Release/net11.0/wwwroot/index.html" || { echo "FAIL: $sample has no wwwroot/index.html"; exit 1; }
            echo "::endgroup::"
          done

      - name: Type Check Svelte Sample
        working-directory: samples/SvelteHelloWorld/frontend
        run: npm run check

      # A frontend build that writes into the sources (tsc emitting next to the .ts files) is how
      # stale transpiled files ended up committed.
      - name: Verify Builds Leave the Sources Untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "FAIL: building the packages and samples changed the working tree"
            exit 1
          fi

  # Boots each web sample in smoke mode on every platform, so a sample that cannot reach its first render,
  # a broken bridge direction, or page errors that no longer fail a run break the PR.
  smoke:
    name: Smoke Boot Web Samples (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Native Library (macOS)
        if: matrix.os == 'macos-latest'
        run: make universal
        working-directory: src/Hermes.Native.macOS

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev cmake xvfb

      - name: Build Native Library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./build.sh
        working-directory: src/Hermes.Native.Linux

      - name: Start Virtual Display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: Build npm Packages
        shell: bash
        run: |
          (cd packages/hermes-bridge && npm ci && npm run build)
          (cd packages/hermes-react && npm ci && npm run build)
          (cd packages/hermes-svelte && npm ci)

      - name: Build Web Samples
        shell: bash
        run: |
          for sample in WebHelloWorld ReactHelloWorld SvelteHelloWorld; do
            dotnet build "samples/$sample" -c Release
          done

      - name: Checkout shared smoke verdict
        uses: actions/checkout@v4
        with:
          repository: Mythetech/workflows
          ref: 586f3f549771d0d523007ee4bb8b7cf3fa9d39a9
          path: .workflows

      - name: Boot Web Samples in Smoke Mode
        shell: pwsh
        env:
          DISPLAY: ':99'
          GDK_BACKEND: x11
        run: ./.github/scripts/Test-WebSmoke.ps1 -VerdictScript .workflows/actions/smoke-verdict/SmokeVerdict.ps1 -OutputDir web-smoke-output

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-output-${{ matrix.platform }}
          path: web-smoke-output
          retention-days: 14
